name: Service Health Probes (Runner)

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *" # Every 5 minutes (offset by 2m to avoid queue spikes)
  workflow_dispatch: # Allow manual check trigger

jobs:
  run-health-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Execute Probes and Save to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OUTLINE_URL: ${{ secrets.OUTLINE_URL }}
          HERMES_URL: ${{ secrets.HERMES_URL }}
          CRM_URL: ${{ secrets.CRM_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          uv run state-panel check
