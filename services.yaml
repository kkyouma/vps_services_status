# ==============================================================================
# State Panel - Services Configuration
# ==============================================================================

settings:
  title: "System Status"
  description: "Live operational status of VPS and Cloud infrastructure"
  refresh_interval_seconds: 60
  history_days: 30
  output_dir: "web/public/data"
  db_path: "state_panel.db"

# Notification settings (ntfy Pub/Sub)
ntfy:
  enabled: false
  server: "${NTFY_SERVER:-https://ntfy.sh}"
  topic: "${NTFY_TOPIC:-}"
  token: "${NTFY_TOKEN:-}"
  priority: 4

# Monitored Services (URLs are private and NEVER exported to public status.json)
services:
  # --- VPS SERVICES ---
  - id: "outline"
    name: "Outline"
    category: "VPS Core"
    type: "http"
    target: "${OUTLINE_URL:-https://outline.mimamita.site}"
    expected_status: 200
    timeout: 5.0
    description: "Internal Knowledge Base & Wiki"

